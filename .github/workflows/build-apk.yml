name: Build Phone YTM Companion APK
on: {workflow_dispatch: {}, push: {branches: [main]}}
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v5
     with: {distribution: temurin, java-version: '17'}
   - uses: android-actions/setup-android@v3
   - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with: {gradle-version: '8.9'}
   - working-directory: android
     run: gradle --no-daemon clean assembleDebug --stacktrace
   - uses: actions/upload-artifact@v4
     with: {name: Phone-YTM-Companion-APK, path: android/app/build/outputs/apk/debug/app-debug.apk, if-no-files-found: error}
